<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELKYN | China to Bangladesh Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Reliable CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.162.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.43/dist/lenis.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: white;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            outline: none;
            z-index: -1;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .scroll-track {
            height: 800vh;
        }
        .section-text {
            position: fixed;
            top: 10%;
            left: 5%;
            max-width: 600px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }
        .section-text.active {
            opacity: 1;
            transform: translateY(0);
        }
        #cursor {
            width: 20px;
            height: 20px;
            background: #00ffff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body class="bg-black text-white">

    <div id="cursor"></div>

    <div class="section-text" id="text-0">
        <h1 class="text-6xl font-bold uppercase tracking-tighter">Bridging Borders,<br>Moving Businesses.</h1>
        <p class="text-xl opacity-60 mt-4">China to Bangladesh, Redefined.</p>
    </div>
    <div class="section-text" id="text-1">
        <h1 class="text-6xl font-bold uppercase tracking-tighter">The Journey</h1>
        <p class="text-xl opacity-60 mt-4">Seamless logistics from source to door.</p>
    </div>
    <div class="section-text" id="text-2">
        <h1 class="text-6xl font-bold uppercase tracking-tighter">Anatomy of Trust</h1>
        <p class="text-xl opacity-60 mt-4">Precision, Safety, and Mastery.</p>
    </div>
    <div class="section-text" id="text-3">
        <h1 class="text-6xl font-bold uppercase tracking-tighter">Knowledge Hub</h1>
        <p class="text-xl opacity-60 mt-4">Intelligence driving global trade.</p>
    </div>

    <div id="glass-card" class="glass fixed right-10 top-1/2 -translate-y-1/2 p-8 rounded-3xl w-80 opacity-0 pointer-events-none transition-all duration-500 translate-x-10">
        <h3 id="card-title" class="text-cyan-400 text-xl font-bold mb-2"></h3>
        <p id="card-content" class="text-sm opacity-80 leading-relaxed"></p>
    </div>

    <div class="scroll-track"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            try {
                // --- CONFIG & STATE ---
                const state = {
                    scrollProgress: 0,
                    activeSection: 0,
                    hoveredAsset: null
                };

                const assetsData = {
                    gps: { title: "Real-time Tracking", content: "Monitor your cargo with precision GPS tracking from the moment it leaves the warehouse." },
                    hull: { title: "Safety & Insurance", content: "Our reinforced logistics chain ensures your goods are protected with world-class insurance." },
                    key: { title: "Customs Mastery", content: "Skip the bureaucracy. Our experts handle all China-BD customs clearances with 100% compliance." }
                };

                // --- INITIALIZATION ---
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x050505);
                scene.fog = new THREE.Fog(0x050505, 10, 50);

                const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 10);

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                document.body.appendChild(renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
                scene.add(ambientLight);

                const spotLight = new THREE.SpotLight(0xffffff, 1);
                spotLight.position.set(10, 10, 10);
                spotLight.castShadow = true;
                scene.add(spotLight);

                const pointLight = new THREE.PointLight(0x00ffff, 1);
                pointLight.position.set(-10, -10, -10);
                scene.add(pointLight);

                // --- 3D OBJECTS ---

                // Section 1: The Globe
                const globeGroup = new THREE.Group();
                const globeGeo = new THREE.SphereGeometry(2, 64, 64);
                const globeMat = new THREE.MeshStandardMaterial({
                    color: 0x002244,
                    wireframe: true,
                    emissive: 0x00ffff,
                    emissiveIntensity: 0.5
                });
                const globe = new THREE.Mesh(globeGeo, globeMat);
                globeGroup.add(globe);
                scene.add(globeGroup);

                // Section 2: The Journey (Box & Path)
                const journeyGroup = new THREE.Group();
                const cargoBox = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.5, 0.5),
                    new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffcc00, emissiveIntensity: 0.5 })
                );
                journeyGroup.add(cargoBox);

                const path = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(-10, 0, -20),
                    new THREE.Vector3(-5, 0, -15),
                    new THREE.Vector3(0, -2, -10),
                    new THREE.Vector3(10, 0, 0),
                ]);

                const createZone = (pos, text, color = 0xffffff) => {
                    const g = new THREE.Group();
                    g.position.copy(pos);
                    const mesh = new THREE.Mesh(
                        new THREE.BoxGeometry(2, 2, 2),
                        new THREE.MeshStandardMaterial({ color, wireframe: true, transparent: true, opacity: 0.3 })
                    );
                    g.add(mesh);
                    return g;
                };
                journeyGroup.add(createZone(new THREE.Vector3(-10, 0, -20), "CN", 0x333333));
                journeyGroup.add(createZone(new THREE.Vector3(-5, 0, -15), "CUSTOMS", 0x00ffff));
                journeyGroup.add(createZone(new THREE.Vector3(0, -2, -10), "SEA", 0x001133));
                journeyGroup.add(createZone(new THREE.Vector3(10, 0, 0), "BD", 0x666666));
                scene.add(journeyGroup);

                // Section 3: Anatomy (Explosion)
                const anatomyGroup = new THREE.Group();
                anatomyGroup.position.set(0, 0, -10);
                const assetSpecs = [
                    { id: 'gps', color: 0x00ffff, pos: new THREE.Vector3(2, 1, 0) },
                    { id: 'hull', color: 0xffd700, pos: new THREE.Vector3(-2, 0, 1) },
                    { id: 'key', color: 0xffffff, pos: new THREE.Vector3(0, -1, 2) },
                ];
                const anatomyMeshes = [];
                assetSpecs.forEach(spec => {
                    const m = new THREE.Mesh(
                        new THREE.BoxGeometry(0.4, 0.4, 0.4),
                        new THREE.MeshStandardMaterial({ color: spec.color, emissive: spec.color, emissiveIntensity: 0.5 })
                    );
                    m.userData = { id: spec.id, originalPos: new THREE.Vector3(0,0,0), targetPos: spec.pos };
                    anatomyGroup.add(m);
                    anatomyMeshes.push(m);
                });
                scene.add(anatomyGroup);

                // Section 4: Hub
                const hubGroup = new THREE.Group();
                hubGroup.position.set(0, 0, -20);
                const crystals = [];
                for(let i=0; i<8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const crystal = new THREE.Mesh(
                        new THREE.BoxGeometry(1, 1.5, 0.1),
                        new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6, metalness: 1, roughness: 0 })
                    );
                    crystal.position.set(Math.cos(angle)*5, 0, Math.sin(angle)*5);
                    crystal.rotation.y = -angle;
                    hubGroup.add(crystal);
                    crystals.push(crystal);
                }
                scene.add(hubGroup);

                // --- ANIMATION ENGINE ---

                const lenis = new Lenis();
                function raf(time) {
                    lenis.raf(time);
                    requestAnimationFrame(raf);
                }
                requestAnimationFrame(raf);

                gsap.registerPlugin(ScrollTrigger);

                ScrollTrigger.create({
                    trigger: ".scroll-track",
                    start: "top top",
                    end: "bottom bottom",
                    scrub: 1,
                    onUpdate: (self) => {
                        state.scrollProgress = self.progress;
                        state.activeSection = Math.min(Math.floor(self.progress * 4), 3);

                        document.querySelectorAll('.section-text').forEach((el, idx) => {
                            el.classList.toggle('active', idx === state.activeSection);
                        });
                    }
                });

                const cursor = document.getElementById('cursor');
                window.addEventListener('mousemove', (e) => {
                    gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1 });
                });

                window.addEventListener('pointermove', (e) => {
                    const mouse = new THREE.Vector2();
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(anatomyMeshes);

                    if (intersects.length > 0) {
                        const id = intersects[0].object.userData.id;
                        state.hoveredAsset = id;
                        const card = document.getElementById('glass-card');
                        document.getElementById('card-title').innerText = assetsData[id].title;
                        document.getElementById('card-content').innerText = assetsData[id].content;
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(-50%) translateX(0)';
                        cursor.style.transform = 'scale(2)';
                    } else {
                        state.hoveredAsset = null;
                        document.getElementById('glass-card').style.opacity = '0';
                        document.getElementById('glass-card').style.transform = 'translateY(-50%) translateX(10px)';
                        cursor.style.transform = 'scale(1)';
                    }
                });

                function animate() {
                    requestAnimationFrame(animate);

                    const p = state.scrollProgress;

                    if (p < 0.25) {
                        const sp = p * 4;
                        globeGroup.rotation.y += 0.002;
                        camera.position.z = THREE.MathUtils.lerp(camera.position.z, 10 * (1 - sp * 0.9), 0.1);
                        camera.lookAt(0, 0, 0);
                    }
                    else if (p >= 0.25 && p < 0.5) {
                        const sp = (p - 0.25) * 4;
                        const point = path.getPointAt(sp);
                        cargoBox.position.copy(point);

                        const tangent = path.getTangentAt(sp);
                        const lookAtTarget = new THREE.Vector3().addVectors(point, tangent);
                        cargoBox.lookAt(lookAtTarget);

                        camera.position.x = THREE.MathUtils.lerp(camera.position.x, point.x + 2, 0.1);
                        camera.position.y = THREE.MathUtils.lerp(camera.position.y, point.y + 2, 0.1);
                        camera.position.z = THREE.MathUtils.lerp(camera.position.z, point.z + 5, 0.1);
                        camera.lookAt(point);
                    }
                    else if (p >= 0.5 && p < 0.75) {
                        const sp = (p - 0.5) * 4;
                        anatomyMeshes.forEach(m => {
                            const target = m.userData.targetPos;
                            m.position.lerp(target.clone().multiplyScalar(Math.min(sp * 2, 1)), 0.1);
                        });
                        camera.position.set(0, 0, 5);
                        camera.lookAt(0, 0, -10);
                    }
                    else {
                        const sp = (p - 0.75) * 4;
                        hubGroup.rotation.y = sp * Math.PI * 2;
                        camera.position.z = THREE.MathUtils.lerp(camera.position.z, 10 / (1 + sp * 2), 0.1);
                        camera.lookAt(0, 0, -20);
                    }

                    renderer.render(scene, camera);
                }

                animate();

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

            } catch (error) {
                console.error("Critical Error initializing 3D experience:", error);
                document.body.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; text-align:center; padding:20px;">
                    <div>
                        <h1 style="color: #00ffff; font-size: 2rem;">WebGL Error</h1>
                        <p>Your browser or device may not support the 3D effects required for this experience. Please try a modern browser like Chrome or Safari.</p>
                        <p style="font-size: 0.8rem; opacity: 0.5; margin-top: 20px;">Error details: ${error.message}</p>
                    </div>
                </div>`;
            }
        });
    </script>
</body>
</html>
